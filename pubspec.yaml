name: dyno_form
description: "A dynamic and reactive form builder for Flutter, supporting validation, multiple input types, and robust configurations."
version: 1.0.0
homepage: https://github.com/MrShakila/Form-Craft

environment:
  sdk: ^3.13.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  reactive_forms: ^18.2.2
  reactive_image_picker: ^8.0.1
  reactive_date_time_picker: ^5.0.1
  intl: ^0.20.2
  uuid: ^4.6.0
  flutter_animate: ^4.5.2
  collection: ^1.18.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
